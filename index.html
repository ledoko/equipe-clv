<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Équipe CLV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f7c74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : appli téléphone en une colonne, barre d'onglets en bas, panneaux qui montent du bas (comme « Mon Budget »). */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#12302d; --muted:#5d7774; --line:#dbe6e4;
  --lagoon:#0f7c74; --lagoon-soft:#d6efec; --sun:#f4b41a; --sun-soft:#fdf0cc;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#c77700; --bad:#c2372f; --bad-soft:#fbe3e1;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1716; --surface:#13221f; --ink:#e4f0ee; --muted:#93aba7; --line:#243835;
  --lagoon:#3cc0b3; --lagoon-soft:#173a36; --sun:#f6c44a; --sun-soft:#3a3115;
  --ok:#4cc27c; --ok-soft:#17321f; --warn:#f0a43a; --bad:#ff7a70; --bad-soft:#3d1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1716; --surface:#13221f; --ink:#e4f0ee; --muted:#93aba7; --line:#243835;
  --lagoon:#3cc0b3; --lagoon-soft:#173a36; --sun:#f6c44a; --sun-soft:#3a3115;
  --ok:#4cc27c; --ok-soft:#17321f; --warn:#f0a43a; --bad:#ff7a70; --bad-soft:#3d1b19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.app.wide{max-width:1240px}
.num{font-variant-numeric:tabular-nums}
.cap::first-letter{text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0;line-height:1.15}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.top .who{font-size:.85rem;color:var(--muted);text-align:right}
.icon{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;color:var(--muted);flex:none}
.icon:hover{background:var(--line)}
.sub{color:var(--muted);font-size:.9rem;margin:-10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.soft{background:var(--sun-soft);border-color:transparent}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead small{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--lagoon);color:#fff;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sun{background:var(--sun);color:#2b2100}
.btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%}
.btn.small{padding:8px 12px;font-size:.9rem;white-space:nowrap;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:99px;padding:3px 8px;white-space:nowrap}
.pill.wait{background:var(--sun-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--line);color:var(--muted)}
.pill.info{background:var(--lagoon-soft);color:var(--lagoon)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t .a{font-weight:600}
.item .t .b{font-size:.84rem;color:var(--muted)}
.empty{padding:18px 16px;color:var(--muted);font-size:.92rem;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.9rem;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.nav b{font-family:var(--display);font-weight:600;text-align:center;flex:1}
/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--muted);position:relative}
.tab i{font-style:normal;font-size:1.3rem;line-height:1.2}
.tab[aria-current="page"]{color:var(--lagoon);font-weight:700}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* connexion */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}
.login h1{font-size:1.8rem;text-align:center}
.dots{display:flex;gap:14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--lagoon)}
.dots i.on{background:var(--lagoon)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border-radius:20px;border:0;background:var(--surface);font-family:var(--display);font-weight:600;font-size:1.6rem;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--lagoon-soft)}
.pad .blank{visibility:hidden}
/* pointage */
.hero{background:#0f7c74;color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:var(--sun);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,10vw,2.7rem);line-height:1}
.hero .hs{font-size:.95rem}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{background:#fff;color:#0f7c74;font-size:1.05rem;padding:13px 18px;flex:1}
.hero .btn.sun{background:var(--sun);color:#2b2100}
.hero.pause{background:#8a6a12}
.hero.done{background:#3e5b57}
/* planning */
.days{display:grid;gap:12px}
.app.wide .days{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
@media(min-width:1100px){.app.wide .days{grid-template-columns:repeat(7,1fr)}}
.day{display:flex;flex-direction:column;gap:7px}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:0 2px}
.day .dh b{font-family:var(--display);font-weight:600}
.day .dh b::first-letter{text-transform:uppercase}
.day.today .dh b{color:var(--lagoon)}
.day .dh small{color:var(--muted);font-size:.78rem}
.shift{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;text-align:left;width:100%}
.shift .h{font-weight:700;font-size:.93rem}
.shift .n{font-size:.88rem}
.shift .p{font-size:.76rem;color:var(--muted)}
.shift.mine{box-shadow:0 0 0 2px var(--lagoon) inset;border-left-width:5px}
.shift .pt{font-size:.76rem;margin-top:3px}
.shift .pt.ok{color:var(--ok)} .shift .pt.no{color:var(--bad)}
.repos{background:var(--lagoon);color:#fff;border-radius:12px;padding:8px 10px;font-size:.88rem;text-align:left;border:0;width:100%}
.repos .h{font-weight:700}
.repos .p{font-size:.76rem;opacity:.85}
.addday{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:6px;color:var(--muted)}
.dayempty{font-size:.82rem;color:var(--muted);padding:4px 2px}
/* tâches */
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.task:first-child{border-top:0}
.task .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff;margin-top:1px}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .tt{font-weight:500}
.task .nn{font-size:.82rem;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:.78rem;color:var(--muted)}
.grp{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px;background:var(--bg);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.sgrp{font-size:.82rem;font-weight:600;color:var(--lagoon);padding:10px 14px 2px}
/* inventaire */
.inv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv .t{flex:1;min-width:0}
.inv .t .a{font-weight:600;font-size:.95rem}
.inv .t .b{font-size:.78rem;color:var(--muted)}
.inv.low .t .a{color:var(--bad)}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none;background:var(--bg)}
.step button{border:0;background:none;width:38px;height:42px;font-size:1.3rem;font-weight:700;color:var(--lagoon)}
.step input{width:52px;border:0;border-radius:0;padding:8px 2px;text-align:center;background:var(--surface);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;padding:0 16px 10px;pointer-events:none}
.bar .btn{pointer-events:auto;box-shadow:0 6px 20px rgba(10,50,45,.25);width:100%;max-width:528px;padding:14px}
/* formulaires, panneaux */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0}
.hint{margin:0;color:var(--muted);font-size:.9rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.err{color:var(--bad);font-size:.88rem;margin:0}
.bigcode{font-family:var(--display);font-weight:800;font-size:3rem;letter-spacing:.2em;text-align:center;color:var(--lagoon)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.inapp{background:var(--bad-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.inapp b{color:var(--bad)}
.inapp p{margin:0}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;flex-direction:column;gap:6px}
.steps .os{font-size:.9rem;color:var(--muted)}
.steps .os b{color:var(--ink)}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0;font-size:.85rem;padding:10px 12px}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.alert i{font-style:normal}
table.rep{width:100%;border-collapse:collapse;font-size:.9rem}
table.rep th,table.rep td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.rep th:first-child,table.rep td:first-child{text-align:left;white-space:normal}
table.rep thead th{border-top:0;color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.scrollx{overflow-x:auto}
.cl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0}
.cl input{width:72px;padding:8px;text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lagoon);animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media print{.tabs,.noprint,.top,.toast{display:none!important}.app{padding:0;max-width:none}body{background:#fff;color:#000}.card{border:0;padding:0}}
</style>
</head>
<body>
<div id="root"></div>
<script>window.API_URL="https://script.google.com/macros/s/AKfycbzNSvplOZr_mzo5FCRWWDMfIh8rHLM_RZn1O0TVuaIyvrXKW0PQ-O0rX5AKCnvNXy9oCg/exec";</script>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
const APP_VERSION="2026-11-13";   // à changer à chaque mise à jour (affiché en bas de l'écran Gérer)
const TOKEN_KEY="equipe-clv-token", INV_KEY="equipe-clv-inventaire";
const UA=navigator.userAgent||"";
const IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const ANDROID=/Android/.test(UA);
const IN_APP=/FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|Snapchat|musical_ly|BytedanceWebview|TikTok|LinkedInApp|Twitter|; wv\)/i.test(UA);
const IS_GAS=!!(window.google&&google.script&&google.script.run);
const API_URL=window.API_URL||"";   // version hébergée (web/) : lien /exec du script, appelé en direct

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>(n<10?"0":"")+n;
const d2n=s=>{const p=String(s).split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5};
const n2d=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const addDays=(s,k)=>n2d(d2n(s)+k);
const wday=s=>((new Date(d2n(s)*864e5).getUTCDay()+6)%7)+1;
const lundiDe=s=>addDays(s,1-wday(s));
const hm2m=t=>{if(!t)return 0;const p=String(t).split(":");return +p[0]*60+(+p[1]||0)};
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h+"h"+(r?pad(r):"")};
const dec=m=>(m/60).toFixed(2).replace(".",",");
const dt=(s,o)=>new Date(d2n(s)*864e5).toLocaleDateString("fr-FR",Object.assign({timeZone:"UTC"},o));
const jourCourt=s=>dt(s,{weekday:"short",day:"numeric"});
const jourLong=s=>dt(s,{weekday:"long",day:"numeric",month:"long"});
const ddmm=s=>s?String(s).slice(8,10)+"/"+String(s).slice(5,7):"";
const moisLabel=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1,1)).toLocaleDateString("fr-FR",{month:"long",year:"numeric",timeZone:"UTC"});
const shiftMois=(m,k)=>{const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)};
const plural=(n,w)=>n+" "+w+(n>1?"s":"");

let token=null, S=null;   // S = {me, employes, postes, reglages, now}
let view="accueil", sub=null;
const cache={weeks:{}};
let backend=null;

// ---------- serveur ----------
function gasBackend(){
  return {call:(action,data)=>new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok)
    .withFailureHandler(e=>ko(new Error(String(e&&e.message||e).replace(/^(Exception|Error):\s*/,"")))).apiCall({action,token,data}))};
}
function fetchBackend(){
  // text/plain : pas de requête préalable CORS ; Google redirige vers googleusercontent qui autorise toutes les origines
  return {call:async(action,data)=>{
    let r;
    try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token,data}),redirect:"follow"})}
    catch(e){throw new Error("Pas de connexion internet ?")}
    let j;try{j=await r.json()}catch(e){throw new Error("Le serveur ne répond pas, réessaie")}
    if(!j.ok)throw new Error(j.erreur||"Erreur");
    return j.r;
  }};
}
function localBackend(){return {call:async(action,data)=>{await new Promise(r=>setTimeout(r,120));return window.LOCAL_API({action,token,data})}}}
async function call(action,data){
  try{return await backend.call(action,data||{})}
  catch(e){
    const msg=String(e.message||e).replace(/^(Exception|Error):\s*/,"");
    if(msg==="SESSION"){logout(true);throw new Error("Reconnecte-toi avec ton code")}
    throw new Error(msg);
  }
}
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,bad?4500:2200)}
async function act(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){toast(e.message,true);throw e}}
const today=()=>S.now.date;
const empName=id=>{const e=S.employes.find(x=>x.id===id);return e?e.prenom:"?"};
const poste=id=>S.postes.find(p=>p.id===id)||{nom:"",couleur:"var(--line)"};
const isAdmin=()=>S&&S.me.role==="admin";

// ---------- connexion ----------
function loginView(err){
  $("#tabs").hidden=true;
  let pin="";
  const dev=window.DEV_PINS?`<p class="hint" style="text-align:center">Mode test : ${window.DEV_PINS.map(p=>esc(p.prenom)+" "+p.pin).join(" · ")}</p>`:"";
  $("#root").innerHTML=`<div class="login">

// ---------- planning ----------
async function vPlanning(){
  const l=sub&&sub.lundi||lundiDe(today()), mode=sub&&sub.mode||"equipe";
  const w=await week(l,true);
  $("#app").classList.add("wide");
  const me=S.me.id, admin=isAdmin(), t=today();
  const fin=addDays(l,6);
  const titre=`${dt(l,{day:"numeric"})}${l.slice(5,7)!==fin.slice(5,7)?" "+dt(l,{month:"short"}):""} – ${dt(fin,{day:"numeric",month:"short"})}`;
  const days=w.jours.map(d=>{
    let sh=w.shifts.filter(s=>s.date===d&&(mode==="equipe"||s.empId===me)).sort((a,b)=>a.debut<b.debut?-1:a.debut>b.debut?1:empName(a.empId)<empName(b.empId)?-1:1);
    const rp=w.repos.filter(r=>r.date===d&&(mode==="equipe"||r.empId===me));
    const tot=sh.reduce((a,s)=>a+hm2m(s.fin)-hm2m(s.debut)-(+s.pause||0),0);
    const cards=rp.map(r=>`<div class="repos"><div class="h">${esc(r.type)}</div><div class="p">Demande #${esc(r.num)}</div><div>${esc(empName(r.empId))}</div></div>`).join("")+
      sh.map(s=>{
        const p=admin&&w.pointages.find(x=>x.empId===s.empId&&x.date===d);
        let pt="";
        if(admin&&d<=t&&d>=(S.reglages.debutPointage||"")){pt=p&&p.arrivee?`<div class="pt ok">⏱ ${p.arrivee}–${p.depart||"…"}${p.pause?` · pause ${p.pause}`:""}${p.corrigePar?" · corrigé":""}</div>`:(d<t?`<div class="pt no">⏱ pas pointé</div>`:"")}
        return `<button class="shift ${s.empId===me?"mine":""}" style="--c:${esc(poste(s.posteId).couleur)}" data-sid="${esc(s.id)}"><span class="h">${s.debut}–${s.fin}</span><span class="n">${esc(empName(s.empId))}</span><span class="p">${esc(poste(s.posteId).nom)}${+s.pause?` · pause ${s.pause} min`:""}${s.note?` · ${esc(s.note)}`:""}</span>${pt}</button>`;
      }).join("");
    return `<div class="day ${d===t?"today":""}"><div class="dh"><b>${jourCourt(d)}</b><small>${tot?dur(tot)+" · "+sh.length+" 👤":""}</small></div>${cards||`<div class="dayempty">${mode==="moi"?"Pas de poste":"Personne"}</div>`}${admin?`<button class="addday" data-add="${d}">+ Ajouter</button>`:""}</div>`;
  }).join("");
  $("#app").innerHTML=`${header("Planning")}
  <div class="nav noprint"><button class="icon" id="wprev" aria-label="Semaine précédente">‹</button><b>${titre}</b><button class="icon" id="wnext" aria-label="Semaine suivante">›</button></div>
  <div class="row wrap noprint"><div class="chips grow"><button class="chip" data-m="equipe" aria-pressed="${mode==="equipe"}">Toute l'équipe</button><button class="chip" data-m="moi" aria-pressed="${mode==="moi"}">Mon planning</button>${l!==lundiDe(t)?`<button class="chip" id="wtoday">Cette semaine</button>`:""}</div>
  ${admin?`<button class="btn small ghost" id="stype">Semaine type</button>`:""}</div>
  <div class="days">${days}</div>
  ${admin?`<p class="hint">Les semaines se remplissent toutes seules à partir de la semaine type. Les repos acceptés retirent les postes de la personne. <button class="btn small ghost" id="reapp">Refaire cette semaine depuis la semaine type</button></p>`:""}`;
  bindOut();
  const setSub=o=>{sub=Object.assign({lundi:l,mode},o);go("planning")};
  $("#wprev").onclick=()=>setSub({lundi:addDays(l,-7)});
  $("#wnext").onclick=()=>setSub({lundi:addDays(l,7)});
  const wt=$("#wtoday");if(wt)wt.onclick=()=>setSub({lundi:lundiDe(t)});
  $("#app").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setSub({mode:b.dataset.m}));
  if(admin){
    $("#app").querySelectorAll("[data-sid]").forEach(b=>b.onclick=()=>shiftSheet(w.shifts.find(s=>s.id===b.dataset.sid),w));
    $("#app").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>shiftSheet({date:b.dataset.add},w));
    $("#stype").onclick=semaineTypeSheet;
    $("#reapp").onclick=()=>confirmSheet("Refaire cette semaine ?","Tous les postes de la semaine sont effacés et recréés depuis la semaine type (les repos acceptés sont respectés).","Refaire",async()=>{await act(()=>call("semaineReappliquer",{date:l}),"Semaine refaite");go("planning")});
  }
}

// ---------- tâches ----------
async function vTaches(){
  const d=sub&&sub.date||today(), filtre=sub&&sub.filtre||"tout", cacher=!!(sub&&sub.cacher);
  const r=await call("taches",{date:d});
  const list=r.taches;
  const moments=[...new Set(list.map(x=>x.moment))];
  const vis=list.filter(x=>(filtre==="tout"||x.moment===filtre)&&!(cacher&&x.fait));
  const n=list.length,f=list.filter(x=>x.fait).length;
  let html="",curM=null,curS=null;
  vis.forEach(x=>{
    if(x.moment!==curM){curM=x.moment;curS=null;html+=`<div class="grp">${esc(x.moment||"Autres")}</div>`}
    if(x.section&&x.section!=="Semaine type"&&x.section!==curS){curS=x.section;html+=`<div class="sgrp">${esc(x.section)}</div>`}
    const badge=x.freq==="semaine"?`<span class="pill info">Hebdo</span>`:x.freq==="mois"?`<span class="pill info">Mensuel</span>`:"";
    const late=x.retard&&!x.fait?`<span class="pill no">Prévu ${jourCourt(x.echeance)}</span>`:"";
    const who=x.fait?`<span>✓ ${esc(x.fait.par)} ${x.fait.le.slice(11,16)}</span>`:"";
    const meta=[badge,late,x.qui?`<span>· ${esc(x.qui)}</span>`:"",who].filter(Boolean).join("");
    html+=`<button class="task ${x.fait?"done":""}" data-t="${esc(x.id)}" ${d>today()?"disabled":""}><span class="box">${x.fait?"✓":""}</span><span class="grow"><div class="tt">${esc(x.titre)}</div>${x.note?`<div class="nn">${esc(x.note)}</div>`:""}${meta?`<div class="meta">${meta}</div>`:""}</span></button>`;
  });
  $("#app").innerHTML=`${header("Tâches")}

  let qt;$("#iq").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{sub=Object.assign({zone,q:e.target.value},{});go("inventaire");setTimeout(()=>{const i=$("#iq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},50)},450)};
  const upd=()=>{$("#ival").textContent=`Valider l'inventaire (${counted()})`};

  il.addEventListener("input",e=>{const row=e.target.closest("[data-a]");if(!row)return;draft[row.dataset.a]=e.target.value.replace(",",".");save();upd();mark(row)});

        $("#sheet").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{lignes.splice(+b.dataset.rm,1);draw()});
        $("#c-add").onchange=e=>{const v=e.target.value;if(v==="__libre"){$("#c-libre").hidden=false;$("#c-libre").focus();return}const a=arts.find(x=>x.id===v);if(a){lignes.push({articleId:a.id,nom:a.nom,unite:a.unite,qte:a.cible||1});draw()}};
        $("#c-libre").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){lignes.push({articleId:"",nom:e.target.value.trim(),qte:1});draw()}};
        $("#c-del").onclick=()=>confirmSheet("Supprimer cette commande ?","","Supprimer",async()=>{await act(()=>call("commandeSupprimer",{id:c.id}),"Supprimée");go("gerer",{page:"commandes"})});
        $("#c-ok").onclick=async()=>{const lib=$("#c-libre");if(lib&&!lib.hidden&&lib.value.trim())lignes.push({articleId:"",nom:lib.value.trim(),qte:1});await act(()=>call("commandeSave",{id:c.id,lignes}),"Enregistré");go("gerer",{page:"commandes"})};
      });
    draw();
  }
}

async function gRapport(){
  const mois=sub&&sub.mois||shiftMois(today().slice(0,7),today().slice(8)<="10"?-1:0);
  const r=await call("rapport",{mois});
  const L=r.lignes;
  const reposTxt=o=>Object.keys(o).map(k=>o[k]+" j "+k.toLowerCase()).join(", ")||"—";
  const sem=r.semaines.map(l=>ddmm(l)+"–"+ddmm(addDays(l,6))).join(", ");
  $("#app").innerHTML=`${backHead("Rapport pour Proxima")}
  <div class="nav noprint"><button class="icon" id="mprev">‹</button><b class="cap">${moisLabel(mois)}</b><button class="icon" id="mnext">›</button></div>
  <div class="card" id="rep">
    <div><b>${esc(r.entreprise==="CLV"?"SUNSHINE COFFEE (Café La Victoria)":r.entreprise)} — heures · ${moisLabel(mois)}</b><div class="small muted">Base mensuelle ${r.base},00 h · généré le ${ddmm(r.genereLe)} à ${r.genereLe.slice(11,16)}</div></div>
    <div class="scrollx"><table class="rep"><thead><tr><th>Salarié</th><th>Heures</th><th>Jours</th><th>HS 25 %</th><th>HS 50 %</th><th>H. compl.</th><th>Repos / absences</th></tr></thead>
    <tbody>${L.map(l=>`<tr><td>${esc(l.nom)}</td><td>${dec(l.minMois)}</td><td>${l.jours}</td><td><b>${dec(l.hs25)}</b></td><td><b>${dec(l.hs50)}</b></td><td>${dec(l.comp)}</td><td>${esc(reposTxt(l.repos))}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">Aucune heure ce mois-ci</td></tr>`}</tbody></table></div>
    <p class="hint small">Heures en décimal (7,50 = 7 h 30), pauses non payées déduites. Heures sup calculées par semaine du lundi au dimanche au-delà de 39 h : +25 % de la 40ᵉ à la 47ᵉ heure, +50 % au-delà. Semaines comptées dans ce mois (celles qui finissent dans le mois) : ${esc(sem)}.</p>
    ${L.some(l=>l.prevus.length||l.incomplets.length)?`<div class="card soft small"><b>À vérifier avant d'envoyer</b>${L.filter(l=>l.prevus.length||l.incomplets.length).map(l=>`<div>${esc(l.nom)} : ${l.prevus.length?plural(l.prevus.length,"jour")+" sans pointage (heures prévues utilisées)":""}${l.prevus.length&&l.incomplets.length?" · ":""}${l.incomplets.length?plural(l.incomplets.length,"départ")+" non pointé"+(l.incomplets.length>1?"s":""):""}</div>`).join("")}<div class="muted">Corrige dans Planning (touche le poste › Heures réelles).</div></div>`:""}
    <details><summary class="small">Détail par semaine</summary><div class="scrollx"><table class="rep"><thead><tr><th>Salarié</th>${r.semaines.map(l=>`<th>${ddmm(l)}</th>`).join("")}</tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.nom)}</td>${l.semaines.map(s=>`<td>${dur(s.min)}${s.hs25||s.hs50?`<br><small class="muted">+${dec(s.hs25+s.hs50)} HS</small>`:""}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>
  </div>
  <div class="row wrap noprint"><button class="btn" id="csv">Télécharger (Excel)</button><button class="btn ghost" id="cp">Copier le tableau</button><button class="btn ghost" id="pr">Imprimer / PDF</button></div>
  <p class="hint noprint">Le mail à social@proxima.nc reste à envoyer par toi (joindre le fichier).</p>`;
  bindBack();
  const setSub=m=>{sub={page:"rapport",mois:m};go("gerer")};
  $("#mprev").onclick=()=>setSub(shiftMois(mois,-1));
  $("#mnext").onclick=()=>setSub(shiftMois(mois,1));
  const rowsT=[["Salarié","Heures travaillées","Jours travaillés","HS 25 %","HS 50 %","Heures complémentaires","Repos / absences","Jours sans pointage"],...L.map(l=>[l.nom,dec(l.minMois),l.jours,dec(l.hs25),dec(l.hs50),dec(l.comp),reposTxt(l.repos),l.prevus.length])];
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(rowsT.map(r=>r.join("\t")).join("\n"));toast("Copié : colle-le dans Excel ou dans un mail")}catch(e){toast("Copie impossible ici",true)}};
  $("#pr").onclick=()=>window.print();
  $("#csv").onclick=()=>{const csv="﻿"+[["Rapport heures "+moisLabel(mois)+" — base "+r.base+" h"],[],...rowsT].map(r=>r.map(c=>{c=String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(";")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`Heures ${r.entreprise} ${mois}.csv`;document.body.appendChild(a);a.click();a.remove()};
}

  <button class="btn sun" id="adde">+ Ajouter une personne</button>`;
  bindBack();
  $("#adde").onclick=()=>edit({});
  $("#app").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(list.find(x=>x.id===b.dataset.e)));

    <div class="grid2"><label class="f">Prénom<input id="e-p" value="${esc(e.prenom||"")}"></label><label class="f">Nom<input id="e-n" value="${esc(e.nom||"")}"></label></div>

    <div class="grid2"><label class="f">Rôle<select id="e-r"><option value="employe">Employé·e</option><option value="admin" ${e.role==="admin"?"selected":""}>Admin (tout voir)</option></select></label><label class="f">Statut<select id="e-a"><option value="oui">Dans l'équipe</option><option value="non" ${e.actif==="non"?"selected":""}>Partie / parti</option></select></label></div>
    <p class="err" id="e-err" hidden></p>

      const data=()=>({id:e.id,prenom:$("#e-p").value.trim(),nom:$("#e-n").value.trim(),email:$("#e-m").value.trim(),posteId:$("#e-po").value,baseHebdo:$("#e-b").value,role:$("#e-r").value,actif:$("#e-a").value});
      const showPin=(r,who)=>open(`<h3>Code de ${esc(who)}</h3><div class="bigcode">${esc(r.pin)}</div><p class="hint">Donne-lui ce code de vive voix. Il ne s'affichera plus : s'il est perdu, refais-en un.</p><button class="btn full" id="pk">C'est noté</button>`,()=>{$("#pk").onclick=()=>go("gerer",{page:"equipe"})},true);
      $("#e-ok").onclick=async()=>{try{const r=await call("employeSave",data());if(r.pin)showPin(r,$("#e-p").value||"");else{toast("Enregistré");S=await call("boot");go("gerer",{page:"equipe"})}}catch(x){$("#e-err").hidden=false;$("#e-err").textContent=x.message}};
      const c=$("#e-code");if(c)c.onclick=()=>confirmSheet("Faire un nouveau code ?","L'ancien code ne marchera plus et la personne devra se reconnecter.","Nouveau code",async()=>{const r=await act(()=>call("employeSave",{id:e.id,nouveauCode:true}));showPin(r,e.prenom)});

  $("#app").innerHTML=`${backHead("Articles de l'inventaire","Quand le stock compté est au mini ou en dessous, l'appli propose de commander jusqu'à la quantité cible.")}
  <button class="btn sun" id="adda">+ Ajouter un article</button>
  ${zones.map(z=>`<section class="sec"><h2>${esc(z)}</h2><div class="list">${r.articles.filter(a=>(a.zone||"Autre")===z).map(a=>`<button class="item" data-a="${esc(a.id)}"><div class="t"><div class="a">${esc(a.nom)}</div><div class="b">${esc(fo(a.fournisseurId))} · mini ${esc(a.min||"?")} · cible ${esc(a.cible||"?")}</div></div><span class="muted">›</span></button>`).join("")}</div></section>`).join("")}`;

    <label class="f">Nom<input id="a-n" value="${esc(a.nom||"")}"></label>
    <label class="f">Fournisseur<select id="a-f"><option value="">—</option>${r.fournisseurs.filter(f=>f.type!=="frais").sort((x,y)=>x.nom<y.nom?-1:1).map(f=>`<option value="${esc(f.id)}" ${f.id===a.fournisseurId?"selected":""}>${esc(f.nom)}</option>`).join("")}</select></label>
    <div class="grid2"><label class="f">Zone<input id="a-z" list="zl" value="${esc(a.zone||"")}"><datalist id="zl">${zones.map(z=>`<option value="${esc(z)}">`).join("")}</datalist></label><label class="f">Unité<input id="a-u" value="${esc(a.unite||"unité")}"></label></div>

    ${a.note?`<p class="hint">${esc(a.note)}</p>`:""}

    <div class="actions"><button class="btn ghost" id="a-x">Annuler</button><button class="btn" id="a-ok">Enregistrer</button></div>`,()=>{

    });

}

  $("#app").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=r.fournisseurs.find(x=>x.id===b.dataset.f);
    open(`<h3>${esc(f.nom)}</h3>
    <label class="f">Type<select id="f-t">${order.map(t=>`<option value="${esc(t)}" ${t===f.type?"selected":""}>${T[t]}</option>`).join("")}</select></label>
    <div class="grid2"><label class="f">Commande par<select id="f-c">${[["email","Email"],["sms","SMS"],["whatsapp","WhatsApp"],["telephone","Téléphone"]].map(([v,l])=>`<option value="${v}" ${(f.canal||"email")===v?"selected":""}>${l}</option>`).join("")}</select></label><label class="f">Téléphone<input id="f-tel" type="tel" value="${esc(f.telephone||"")}"></label></div>
    <label class="f">Email pour les commandes<input id="f-e" type="email" value="${esc(f.email)}"></label>
    <div class="grid2"><label class="f">Jour de commande<input id="f-j" value="${esc(f.jourCommande)}" placeholder="ex. lundi"></label><label class="f">Délai de livraison (jours)<input id="f-d" inputmode="numeric" value="${esc(f.delai)}"></label></div>
    <label class="f">Note<input id="f-n" value="${esc(f.note)}"></label>
    <div class="actions"><button class="btn ghost" id="f-x">Annuler</button><button class="btn" id="f-ok">Enregistrer</button></div>`,()=>{

      $("#f-ok").onclick=async()=>{await act(()=>call("fournisseurSave",{id:f.id,type:$("#f-t").value,canal:$("#f-c").value,telephone:$("#f-tel").value.trim(),email:$("#f-e").value.trim(),jourCommande:$("#f-j").value.trim(),delai:$("#f-d").value.trim(),note:$("#f-n").value.trim()}),"Enregistré");go("gerer",{page:"fournisseurs"})};
    });
  });
}

// ---------- panneaux ----------
function open(html,onMount,locked){const sh=$("#sheet");sh.dataset.locked=locked?"1":"";sh.innerHTML=html;$("#scrim").hidden=false;sh.scrollTop=0;onMount&&onMount()}
function close(){$("#scrim").hidden=true;$("#sheet").innerHTML=""}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"&&!$("#sheet").dataset.locked)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden&&!$("#sheet").dataset.locked)close()});
function confirmSheet(title,text,label,fn){
  open(`<h3>${esc(title)}</h3>${text?`<p class="hint">${esc(text)}</p>`:""}<div class="actions"><button class="btn ghost" id="c-no">Annuler</button><button class="btn" id="c-yes">${esc(label)}</button></div>`,()=>{
    $("#c-no").onclick=close;
    $("#c-yes").onclick=async()=>{$("#c-yes").disabled=true;close();try{await fn()}catch(e){}};
  });
}
function installSheet(){
  const ios=`<div class="os"><b>iPhone :</b> touche <b>⋯</b> ou l'icône boussole, puis <b>« Ouvrir dans Safari »</b>.</div>`;
  const and=`<div class="os"><b>Android :</b> touche <b>⋮</b>, puis <b>« Ouvrir dans Chrome »</b>.</div>`;
  const ios3=`<div class="os"><b>iPhone</b> (dans Safari) : bouton <b>Partager</b>, puis <b>« Sur l'écran d'accueil »</b>.</div>`;
  const and3=`<div class="os"><b>Android</b> (dans Chrome) : menu <b>⋮</b>, puis <b>« Ajouter à l'écran d'accueil »</b>.</div>`;
  open(`<h3>Installer l'appli</h3>
  <ol class="steps">
    <li><b>Ouvre le lien dans ton vrai navigateur</b>, pas dans l'appli qui te l'a envoyé (Messenger, Facebook, Gmail, Texto…).
      ${ANDROID?and+ios:ios+and}
      <div class="linkrow" id="in-linkrow" hidden><input id="in-url" readonly aria-label="Lien de l'appli"><button class="btn small" id="in-copy">Copier</button></div>
    </li>
    <li><b>Ajoute l'appli à ton écran d'accueil</b> pour la retrouver comme une vraie appli.
      ${IOS?ios3+and3:and3+ios3}
    </li>
    <li><b>Entre ton code à 4 chiffres</b> une seule fois : le téléphone s'en souvient.</li>
  </ol>
  <button class="btn full" id="in-ok">Compris</button>`,()=>{
    $("#in-ok").onclick=close;
    const show=url=>{
      if(!url||!$("#in-url"))return;
      $("#in-url").value=url;$("#in-linkrow").hidden=false;
      $("#in-copy").onclick=async()=>{const inp=$("#in-url"),b=$("#in-copy");try{await navigator.clipboard.writeText(inp.value)}catch(e){inp.select();try{document.execCommand("copy")}catch(e2){}}b.textContent="✓ Copié";setTimeout(()=>{b.textContent="Copier"},2000)};
    };
    if(API_URL)show(location.origin+location.pathname);
    else if(IS_GAS)google.script.run.withSuccessHandler(show).getAppUrl();
  });
}

// au retour sur l'appli (téléphone sorti de veille), on rafraîchit la date et l'écran
let hiddenAt=0;
document.addEventListener("visibilitychange",async()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(!S||Date.now()-hiddenAt<5*60000||!$("#scrim").hidden)return;
  try{S=await call("boot");cache.weeks={};go(view)}catch(e){}
});

// ---------- démarrage ----------
(async function boot(){
  backend=IS_GAS?gasBackend():API_URL?fetchBackend():(window.LOCAL_API?localBackend():null);
  if(!backend){$("#root").innerHTML=`<div class="login"><h1>Équipe CLV</h1><p class="hint">Cette page s'ouvre depuis le lien de l'appli.</p></div>`;return}
  try{token=localStorage.getItem(TOKEN_KEY)}catch(e){}
  if(!token){loginView();return}
  try{await start()}catch(e){if(token)loginView(e.message)}
})();
})();
</script>
